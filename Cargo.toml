[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/domain",
    "crates/storage",
    "crates/commands",
    "crates/hook-client",
]

[workspace.package]
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
