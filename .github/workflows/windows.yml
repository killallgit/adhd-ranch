name: windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows validation is intentionally manual while the app remains a prototype.
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 NSIS
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64 NSIS
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Build Windows installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: adhd-ranch-${{ matrix.target }}-nsis
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1
