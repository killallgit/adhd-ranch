name: windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows.yml"
      - "src-tauri/**"
      - "crates/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  # A pull request only needs to know the tree still compiles for Windows — the
  # runner is Windows, so an ordinary check covers it. Bundling an installer is
  # release work, and release.yml runs that same command on a tag.
  check:
    name: Type check
    if: github.event_name == 'pull_request'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: check

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      # generate_context! resolves frontendDist while compiling, so the bundle
      # has to be on disk before the check runs.
      - name: Build frontend
        run: npm run build

      - name: Type check
        run: cargo check --workspace --all-targets

  # Kept on demand for a pre-release dry run of the Windows half of release.yml.
  bundle:
    name: ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 NSIS
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64 NSIS
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Build Windows installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: adhd-ranch-${{ matrix.target }}-nsis
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 1
