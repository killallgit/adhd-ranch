name: windows-build-smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-build-smoke.yml"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64 NSIS
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: Windows ARM64 NSIS
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Build Windows installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: adhd-ranch-${{ matrix.target }}-nsis
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
