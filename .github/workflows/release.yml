name: release
run-name: release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, without the leading v"
        required: true
        type: string
      prerelease:
        description: "Mark the release as a prerelease"
        required: true
        default: false
        type: boolean
permissions:
  contents: read

concurrency:
  group: release-v${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            echo "Run releases from the default branch" >&2
            exit 1
          fi

          version="${{ inputs.version }}"
          version="${version#v}"
          tag="v${version}"
          prerelease="${{ inputs.prerelease }}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be SemVer-like, for example 0.1.0 or 0.1.0-beta.1" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail

          if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha' 2>/dev/null)"; then
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "$TAG already points to $tag_sha instead of $GITHUB_SHA" >&2
              exit 1
            fi
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "true" ]]; then
              echo "$TAG is already published" >&2
              exit 1
            fi

            while IFS= read -r asset; do
              gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            done < <(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          else
            args=(
              "$TAG"
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --title "Adhd Ranch $TAG"
              --notes $'Unsigned desktop builds for Adhd Ranch.\n\nUse the platform installer matching your operating system and CPU architecture. SHA256 checksums are attached as `SHA256SUMS.txt`.'
              --generate-notes
              --draft
            )
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi

  build:
    name: ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal DMG
            runner: macos-14
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --config release-version.json --target universal-apple-darwin --bundles dmg
          - label: Windows x64 NSIS
            runner: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --config release-version.json --target x86_64-pc-windows-msvc --bundles nsis
          - label: Windows ARM64 NSIS
            runner: windows-11-arm
            rust-targets: aarch64-pc-windows-msvc
            args: --config release-version.json --target aarch64-pc-windows-msvc --bundles nsis
          - label: Linux x64 AppImage + deb
            runner: ubuntu-22.04
            rust-targets: ""
            args: --config release-version.json --bundles appimage,deb

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust toolchain
        if: matrix.rust-targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust toolchain with targets
        if: matrix.rust-targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: release-${{ matrix.runner }}-${{ matrix.rust-targets }}

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Write release version config
        shell: bash
        run: |
          printf '{"version":"%s"}\n' "${{ needs.prepare.outputs.version }}" > release-version.json

      # `tauri build --target universal-apple-darwin` compiles the host once per arch,
      # so `build.rs` only ever sees `aarch64-` or `x86_64-apple-darwin` and names the
      # sidecar for that one. The bundler then asks for a `-universal-apple-darwin`
      # sidecar that nothing produced. The build script cannot know both arches are
      # wanted — cargo never hands it that triple — so the job asking for a universal
      # app is the one that has to make it.
      - name: Build the universal sidecar
        if: contains(matrix.args, 'universal-apple-darwin')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/binaries
          for arch in aarch64 x86_64; do
            rustc --edition 2021 -O \
              --target "${arch}-apple-darwin" \
              -o "src-tauri/binaries/adhd-ranch-hook-${arch}-apple-darwin" \
              crates/hook-client/src/main.rs
          done
          lipo -create \
            src-tauri/binaries/adhd-ranch-hook-aarch64-apple-darwin \
            src-tauri/binaries/adhd-ranch-hook-x86_64-apple-darwin \
            -output src-tauri/binaries/adhd-ranch-hook-universal-apple-darwin
          lipo -info src-tauri/binaries/adhd-ranch-hook-universal-apple-darwin

      - name: Build and upload release package
        id: tauri
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          args: ${{ matrix.args }}
          retryAttempts: 2
          assetNamePattern: "[name]_[version]_[platform]_[arch][setup].[ext]"

      - name: Find packaged artifacts
        id: packages
        shell: bash
        run: |
          set -euo pipefail

          for root in target src-tauri/target; do
            if [[ -d "$root" ]]; then
              find "$root" \
                -type f \( \
                  -name '*.AppImage' -o \
                  -name '*.deb' -o \
                  -name '*.dmg' -o \
                  -name '*.exe' \
                \)
            fi
          done | sort > package-paths.txt

          if [[ ! -s package-paths.txt ]]; then
            echo "No packaged release artifacts were found" >&2
            exit 1
          fi

          cat package-paths.txt
          {
            echo "paths<<EOF"
            cat package-paths.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.packages.outputs.paths }}

  checksums:
    name: SHA256 checksums
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" \
            --dir dist \
            --repo "$GITHUB_REPOSITORY" \
            --skip-existing \
            --pattern '*.AppImage' \
            --pattern '*.deb' \
            --pattern '*.dmg' \
            --pattern '*.exe'

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          artifacts=(*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release assets were downloaded for checksum generation" >&2
            exit 1
          fi

          sha256sum "${artifacts[@]}" | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish:
    needs: [prepare, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease="$PRERELEASE"

  cleanup:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-asset-retention
      cancel-in-progress: false
    steps:
      - name: Keep assets for the newest two releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
            jq -sr '
              add
              | map(select(.draft == false and .published_at != null))
              | sort_by(.published_at)
              | reverse
              | .[2:]
              | .[] as $release
              | $release.assets[]
              | [$release.tag_name, (.id | tostring), .name]
              | @tsv
            ' |
            while IFS=$'\t' read -r tag asset_id asset_name; do
              echo "Deleting $asset_name from $tag"
              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" \
                --silent
            done
