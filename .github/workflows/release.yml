name: release
run-name: release ${{ github.event.release.tag_name || format('v{0}', inputs.version) || github.ref_name }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, without the leading v"
        required: true
        type: string
      draft:
        description: "Create or update the release as a draft"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a prerelease"
        required: true
        default: false
        type: boolean
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      draft: ${{ steps.release.outputs.draft }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            version="${version#v}"
            tag="v${version}"
            draft="${{ inputs.draft }}"
            prerelease="${{ inputs.prerelease }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
            version="${tag#v}"
            draft="${{ github.event.release.draft }}"
            prerelease="${{ github.event.release.prerelease }}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            draft="false"
            if [[ "$version" == *-* ]]; then
              prerelease="true"
            else
              prerelease="false"
            fi
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be SemVer-like, for example 0.1.0 or 0.1.0-beta.1" >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "draft=$draft"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS universal DMG
            runner: macos-14
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --config release-version.json --target universal-apple-darwin --bundles dmg
          - label: Windows x64 NSIS
            runner: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --config release-version.json --target x86_64-pc-windows-msvc --bundles nsis
          - label: Windows ARM64 NSIS
            runner: windows-11-arm
            rust-targets: aarch64-pc-windows-msvc
            args: --config release-version.json --target aarch64-pc-windows-msvc --bundles nsis
          - label: Linux x64 AppImage + deb
            runner: ubuntu-22.04
            rust-targets: ""
            args: --config release-version.json --bundles appimage,deb

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux package dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Rust toolchain
        if: matrix.rust-targets == ''
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust toolchain with targets
        if: matrix.rust-targets != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: release-${{ matrix.runner }}-${{ matrix.rust-targets }}

      - name: Install frontend deps
        run: npm ci --no-audit --no-fund

      - name: Write release version config
        shell: bash
        run: |
          printf '{"version":"%s"}\n' "${{ needs.prepare.outputs.version }}" > release-version.json

      - name: Build and upload release package
        id: tauri
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: Adhd Ranch ${{ needs.prepare.outputs.tag }}
          releaseBody: |
            Unsigned desktop builds for Adhd Ranch.

            Use the platform installer matching your operating system and CPU architecture. SHA256 checksums are attached as `SHA256SUMS.txt`.
          releaseDraft: ${{ needs.prepare.outputs.draft }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          generateReleaseNotes: true
          args: ${{ matrix.args }}
          retryAttempts: 2
          assetNamePattern: "[name]_[version]_[platform]_[arch][setup].[ext]"

      - name: Find packaged artifacts
        id: packages
        shell: bash
        run: |
          set -euo pipefail

          for root in target src-tauri/target; do
            if [[ -d "$root" ]]; then
              find "$root" \
                -type f \( \
                  -name '*.AppImage' -o \
                  -name '*.deb' -o \
                  -name '*.dmg' -o \
                  -name '*.exe' \
                \)
            fi
          done | sort > package-paths.txt

          if [[ ! -s package-paths.txt ]]; then
            echo "No packaged release artifacts were found" >&2
            exit 1
          fi

          cat package-paths.txt
          {
            echo "paths<<EOF"
            cat package-paths.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.packages.outputs.paths }}

  checksums:
    name: SHA256 checksums
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" \
            --dir dist \
            --repo "$GITHUB_REPOSITORY" \
            --skip-existing \
            --pattern '*.AppImage' \
            --pattern '*.deb' \
            --pattern '*.dmg' \
            --pattern '*.exe'

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          artifacts=(*)
          if (( ${#artifacts[@]} == 0 )); then
            echo "No release assets were downloaded for checksum generation" >&2
            exit 1
          fi

          sha256sum "${artifacts[@]}" | sort -k2 > ../SHA256SUMS.txt
          cat ../SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release upload "$TAG" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
