[package]
name = "adhd-ranch-commands"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
adhd-ranch-domain = { path = "../domain" }
adhd-ranch-storage = { path = "../storage" }
log = "0.4"
serde = { workspace = true }
ts-rs = { version = "12", optional = true }

[features]
export-ts = ["dep:ts-rs"]

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"
