version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  install:
    desc: Install frontend deps
    run: once
    cmds:
      - npm install --no-audit --no-fund

  dev:
    desc: Run Tauri dev (opens app window)
    deps: [install]
    cmds:
      - npm run tauri -- dev

  run:
    desc: Alias for dev
    cmds:
      - task: dev

  test:rust:
    desc: Run Rust unit tests (workspace minus the Tauri host, which is slow to compile)
    cmds:
      - cargo test -p adhd-ranch-domain -p adhd-ranch-storage -p adhd-ranch-commands --all-targets

  gen-types:
    desc: Regenerate src/types/generated/*.ts from Rust domain via ts-rs
    cmds:
      - cargo test -p adhd-ranch-domain --features export-ts --quiet

  gen-types:check:
    desc: Fail if generated TS types are out of sync with Rust domain
    cmds:
      - task: gen-types
      - git diff --exit-code -- src/types/generated
      - |
        untracked=$(git ls-files --others --exclude-standard -- src/types/generated)
        if [ -n "$untracked" ]; then
          echo "Untracked generated files (commit them):" >&2
          echo "$untracked" >&2
          exit 1
        fi

  test:web:
    desc: Run frontend tests
    deps: [install]
    cmds:
      - npm run test

  test:
    desc: All unit tests
    cmds:
      - task: test:rust
      - task: test:web

  typecheck:
    desc: TypeScript typecheck
    deps: [install]
    cmds:
      - npm run typecheck

  lint:rust:
    desc: clippy + rustfmt --check
    deps: [build:web]
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy -p adhd-ranch-domain -p adhd-ranch-storage -p adhd-ranch-commands -p adhd-ranch-hook --all-targets -- -D warnings
      - cargo clippy -p adhd-ranch --all-targets -- -D warnings
      - task: lint:rust:release

  lint:rust:release:
    desc: clippy the Tauri host with debug_assertions off
    deps: [build:web]
    cmds:
      # Host-only because the host is the only place the two profiles compile
      # different code: src-tauri gates tray items, the dev menu and a ui_bridge
      # branch on debug_assertions, and the debug pass never sees the release
      # side. No crate under crates/ has a debug_assertions gate, so a release
      # pass over them would re-lint identical code. Add the crate here the day
      # one grows a profile-gated branch; it costs seconds, not minutes.
      - cargo clippy --release -p adhd-ranch --all-targets -- -D warnings

  lint:web:
    desc: Biome lint frontend
    deps: [install]
    cmds:
      - npm run lint

  lint:unused:rust:
    desc: Unused Cargo dependencies and Rust files outside the module tree (cargo-shear)
    cmds:
      - |
        if ! command -v cargo-shear >/dev/null; then
          echo "cargo-shear is not installed. Run: cargo install --locked cargo-shear" >&2
          exit 1
        fi
      - cargo shear

  lint:unused:web:
    desc: Unused frontend files, exports, and npm dependencies (knip)
    deps: [install]
    cmds:
      - npm run lint:unused

  lint:ipc:
    desc: Tauri commands and events that only one side of the IPC boundary uses
    cmds:
      - node scripts/check-ipc.mjs

  lint:css:
    desc: CSS classes that no source file references
    cmds:
      - node scripts/check-css.mjs

  lint:unused:
    desc: All unused-code checks
    cmds:
      - task: lint:unused:rust
      - task: lint:unused:web
      - task: lint:ipc
      - task: lint:css

  lint:
    desc: Lint Rust + frontend + unused code
    cmds:
      - task: lint:rust
      - task: lint:web
      - task: lint:unused

  fmt:
    desc: Format Rust + frontend
    cmds:
      - cargo fmt --all
      - npm run fmt

  check:
    desc: PR gate — lint + typecheck + tests + ts-rs drift check
    cmds:
      - task: lint
      - task: typecheck
      - task: test
      - task: gen-types:check

  check:windows:
    desc: Type-check the workspace for Windows from a macOS or Linux host — the cfg(unix) errors CI catches late
    deps: [build:web]
    vars:
      TARGET: '{{.TARGET | default "x86_64-pc-windows-msvc"}}'
    cmds:
      # tauri-build compiles a Windows resource even for a check, and llvm-rc is its
      # only cross-OS resource compiler. Homebrew keeps llvm keg-only, so it is on
      # disk far more often than it is on PATH.
      - |
        rc=$(command -v llvm-rc || ls -1 "$(brew --prefix 2>/dev/null)"/opt/llvm*/bin/llvm-rc 2>/dev/null | head -1)
        if [ -z "$rc" ]; then
          echo "llvm-rc not found. Run: brew install llvm" >&2
          exit 1
        fi
        ADHD_RANCH_SKIP_SIDECAR=1 RC="$rc" cargo check --workspace --all-targets --target '{{.TARGET}}'

  build:web:
    desc: Build frontend bundle
    run: once
    deps: [install]
    cmds:
      - npm run build

  build:
    desc: Tauri release build (macOS .app)
    deps: [install]
    cmds:
      - npm run tauri -- build

  ci:
    desc: What CI runs
    cmds:
      - task: check
